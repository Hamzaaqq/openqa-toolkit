name: PHP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl
          coverage: none
      - run: php -l src/Audit.php && php -l src/Http.php && php -l bin/openqa
      - run: composer validate --strict
      - run: php tests/run.php
      - run: php bin/openqa --version
      - name: Composer consumer installation
        run: |
          mkdir "$RUNNER_TEMP/openqa-consumer"
          cd "$RUNNER_TEMP/openqa-consumer"
          composer init --name=openqa/consumer --no-interaction
          composer config repositories.openqa path "$GITHUB_WORKSPACE"
          composer require --dev 'hamzaaqq/openqa-toolkit:@dev' --no-interaction
          test "$(vendor/bin/openqa --version)" = 'OpenQA Toolkit 0.1.0'
      - name: CLI sample
        run: |
          set +e
          php bin/openqa html examples/sample.html --json > report.json
          code=$?
          set -e
          test "$code" = 1
          php -r '$r=json_decode(file_get_contents("report.json"),true,512,JSON_THROW_ON_ERROR); if ($r["issue_count"] !== 3) exit(1);'
